<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Watt About You</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              heading: ['Poppins', 'sans-serif'],
              body: ['Open Sans', 'sans-serif'],
            },
            colors: {
              brand: {
                blue:    '#5674FF',
                accent:  '#1423DC',
                green:   '#7DD692',
                orange:  '#FD7D5D',
                yellow:  '#FECF55',
                green2:  '#96CD32',
                bg:      '#F8F9FC',
                surface: '#EAEFF5',
              },
              // Conserver enedis-* pour compatibilité ExpertView / graphiques existants
              enedis: {
                blue:   '#132F8D',
                bright: '#1423DC',
                title:  '#1423DC',
                green:  '#7DD692',
                light:  '#F8F9FC',
              }
            },
            animation: {
              'fade-in': 'fadeIn 0.5s ease-out both',
              'fade-up': 'fadeUp 0.5s ease-out both',
            },
            keyframes: {
              fadeIn: {
                '0%':   { opacity: '0' },
                '100%': { opacity: '1' },
              },
              fadeUp: {
                '0%':   { opacity: '0', transform: 'translateY(16px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
            },
          }
        }
      }
    </script>

    <style>
      /* ── Scroll reveal ──────────────────────────────────────────── */
      .reveal {
        opacity: 0;
        transform: translateY(20px);
        transition: opacity 600ms ease-out, transform 600ms ease-out;
      }
      .reveal.is-visible {
        opacity: 1;
        transform: translateY(0);
      }

      /* Fade seul (sans translate) */
      .reveal-fade {
        opacity: 0;
        transition: opacity 600ms ease-out;
      }
      .reveal-fade.is-visible {
        opacity: 1;
      }

      /* Fade + Blur — apparition de contenu narratif */
      .reveal-blur {
        opacity: 0;
        filter: blur(8px);
        transform: translateY(10px);
        transition: opacity 700ms ease-out, filter 700ms ease-out, transform 700ms ease-out;
      }
      .reveal-blur.is-visible {
        opacity: 1;
        filter: blur(0);
        transform: translateY(0);
      }

      /* Text-appear — pour les paragraphes narratifs (Marie réfléchit, Emma explique) */
      .text-appear {
        opacity: 0;
        transition: opacity 900ms ease-out;
      }
      .text-appear.is-visible {
        opacity: 1;
      }

      /* Stagger delays */
      .delay-75  { transition-delay: 75ms; }
      .delay-100 { transition-delay: 100ms; }
      .delay-150 { transition-delay: 150ms; }
      .delay-200 { transition-delay: 200ms; }
      .delay-300 { transition-delay: 300ms; }
      .delay-400 { transition-delay: 400ms; }
      .delay-500 { transition-delay: 500ms; }
      .delay-600 { transition-delay: 600ms; }
      .delay-700 { transition-delay: 700ms; }
      .delay-800 { transition-delay: 800ms; }

      /* Jauge animation */
      .gauge-fill {
        transition: width 900ms cubic-bezier(0.4, 0, 0.2, 1);
      }

      /* Bounce arrow (DPE confirmé) */
      @keyframes bounceDown {
        0%, 100% { transform: translateY(0); }
        50%       { transform: translateY(8px); }
      }
      .bounce-down {
        animation: bounceDown 1.2s ease-in-out infinite;
      }

      /* Form step transitions */
      @keyframes slideInUp {
        from { opacity: 0; transform: translateY(16px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      .slide-in-up {
        animation: slideInUp 400ms ease-out both;
      }

      /* Hover lift sur cartes / boutons */
      .hover-lift {
        transition: transform 200ms ease-out, box-shadow 200ms ease-out;
      }
      .hover-lift:hover {
        transform: translateY(-3px);
        box-shadow: 0 8px 30px rgba(22, 35, 220, 0.12);
      }

      /* Accessibilité */
      @media (prefers-reduced-motion: reduce) {
        .reveal, .reveal-fade, .reveal-blur, .text-appear {
          transition: none; opacity: 1; filter: none; transform: none;
        }
        .gauge-fill { transition: none; }
        .bounce-down { animation: none; }
        .slide-in-up { animation: none; }
      }

      body {
        font-family: 'Open Sans', sans-serif;
        background-color: #F8F9FC;
        color: #1e293b;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
